<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard Flexbox</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="navbar">
    <div class="logo">⚡ Analytics</div>
    <nav class="nav-links">
      <a href="#">Visão Geral</a>
      <a href="#">Relatórios</a>
      <a href="#">Configurações</a>
    </nav>
  </header>


  <main class="container">
    
    <h2>Métricas Principais</h2>


    <div class="cards-grid">
      
      <div class="card">
        <h3>Vendas Totais</h3>
        <p class="valor">R$ 24.500</p>
        <span class="tag positivo">+12% este mês</span>
      </div>

      <div class="card">
        <h3>Novos Clientes</h3>
        <p class="valor">1.240</p>
        <span class="tag positivo">+5% esta semana</span>
      </div>

      <div class="card">
        <h3>Taxa de Conversão</h3>
        <p class="valor">3.8%</p>
        <span class="tag negativo">-0.4% hoje</span>
      </div>

    </div>

  </main>

</body>
</html>
